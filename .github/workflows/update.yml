name: Statpad update

on:
  schedule:
    - cron: "2-59/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh every source now (uses odds credits)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: statpad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .statpad
          key: statpad-state-${{ github.run_id }}
          restore-keys: statpad-state-

      - name: Fetch data and fit the model
        id: update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_MIN_INTERVAL: ${{ vars.ODDS_MIN_INTERVAL }}
          ODDS_MONTHLY_CREDITS: ${{ vars.ODDS_MONTHLY_CREDITS }}
          ODDS_RESET_DAY: ${{ vars.ODDS_RESET_DAY }}
          ODDS_SPORTS: ${{ vars.ODDS_SPORTS }}
          STATPAD_TIMEZONE: ${{ vars.STATPAD_TIMEZONE }}
          STATPAD_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python update.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .statpad
          key: statpad-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Commits the track record. This also keeps the schedule alive: GitHub pauses
      # scheduled runs in a repo that has had no commits for 60 days.
      - name: Commit track record
        run: |
          if [ -n "$(git status --porcelain -- track.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add track.json
            git commit -m "Track record update"
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Push failed; the next run will try again."
          fi

      - uses: actions/configure-pages@v5
        id: pages
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'

      - name: Assemble site
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # link previews (WhatsApp, Telegram, X) need the site's full address, which only the deploy knows
          if [ -n "$BASE_URL" ]; then
            sed "s#content=\"\./#content=\"${BASE_URL%/}/#g" index.html > _site/index.html
          else
            cp index.html _site/index.html
          fi
          # app files: offline support, install details and the preview picture
          for f in sw.js manifest.webmanifest og.jpg; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          # the app icons are drawn here, so they never need uploading
          if pip install --quiet --disable-pip-version-check pillow; then
            cd _site
            python - <<'PY'
          from PIL import Image, ImageDraw
          SS = 4  # draw 4x larger, then shrink for smooth edges
          INK, BG, BAR = (238, 243, 239, 255), (13, 24, 19, 255), (111, 134, 255, 255)
          def mark(d, ox, oy, k):
              S = lambda v: round(v * k * SS)
              w1, w2 = S(1.6), S(1.4)
              d.rounded_rectangle([ox + S(2.2), oy + S(4.2), ox + S(21.8), oy + S(19.8)], radius=S(2.8), outline=INK, width=w1)
              d.rectangle([ox + S(11.3), oy + S(5), ox + S(12.7), oy + S(19)], fill=INK)
              d.ellipse([ox + S(8.7), oy + S(8.7), ox + S(15.3), oy + S(15.3)], outline=INK, width=w2)
              d.rectangle([ox + S(15.5), oy + S(9), ox + S(18.5), oy + S(15)], fill=BAR)
          def icon(size, full, art):
              n = size * SS
              im = Image.new('RGBA', (n, n), BG if full else (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              if not full:
                  pad, r = round(n * 32 / 512), round(n * 104 / 512)
                  d.rounded_rectangle([pad, pad, n - pad, n - pad], radius=r, fill=BG, outline=(40, 51, 46, 255), width=round(n * 6 / 512))
              a = art * SS
              mark(d, (n - a) // 2, (n - a) // 2, art / 24)
              return im.resize((size, size), Image.LANCZOS)
          icon(512, False, 300).save('icon-512.png', optimize=True)
          icon(512, False, 300).resize((192, 192), Image.LANCZOS).save('icon-192.png', optimize=True)
          icon(512, True, 250).save('icon-maskable.png', optimize=True)
          icon(180, True, 112).save('apple-touch-icon.png', optimize=True)
          PY
            cd ..
          else
            echo "Could not install Pillow; app icons skipped this time."
          fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.update.outputs.changed == 'true' || github.event_name != 'schedule'
        
        uses: actions/deploy-pages@v4
